name: Build examples

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.solution.name }} / ${{ matrix.target }} / ${{ matrix.build-type }} / ${{ matrix.solution.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solution:
          - name: HelloWorld
            directory: Examples/HelloWorld
            file: helloworld-gcc.csolution.yml
            compiler: GCC
          - name: HelloWorld
            directory: Examples/HelloWorld
            file: helloworld-ac6.csolution.yml
            compiler: AC6
          - name: IPM_ARM_MHUv2
            directory: Examples/IPM_ARM_MHUv2
            file: ipm_arm_mhuv2-gcc.csolution.yml
            compiler: GCC
          - name: IPM_ARM_MHUv2
            directory: Examples/IPM_ARM_MHUv2
            file: ipm_arm_mhuv2-ac6.csolution.yml
            compiler: AC6
          - name: LPI2C
            directory: Examples/LPI2C
            file: lpi2c-gcc.csolution.yml
            compiler: GCC
          - name: LPI2C
            directory: Examples/LPI2C
            file: lpi2c-ac6.csolution.yml
            compiler: AC6
        target:
          - DevKit-E7
          - DevKit-E8
        build-type:
          - Debug
          - Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up CMSIS build tools
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: ./vcpkg-configuration.json
          cache: cmsis-tools-${{ runner.os }}-${{ hashFiles('vcpkg-configuration.json') }}

      - name: Set up Alif Zephyr SDK
        shell: bash
        run: |
          python -m pip install west
          mkdir sdk-alif
          cd sdk-alif
          west init -m https://github.com/alifsemi/sdk-alif.git --mr v2.3.0
          west update
          git -C zephyr apply "${GITHUB_WORKSPACE}/.github/patches/sdk-alif-v2.3.0-armclang-linker.patch"
          python -m pip install -r zephyr/scripts/requirements.txt

      - name: Activate Arm Compiler license
        if: matrix.solution.compiler == 'AC6'
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Build
        working-directory: ${{ matrix.solution.directory }}
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/sdk-alif/zephyr
        run: >-
          cbuild ${{ matrix.solution.file }}
          --packs
          --context ".${{ matrix.build-type }}+${{ matrix.target }}"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.solution.name }}-${{ matrix.target }}-${{ matrix.build-type }}-${{ matrix.solution.compiler }}
          path: ${{ matrix.solution.directory }}/out
